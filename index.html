<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zaphir Restaurant</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI", Arial, sans-serif;
}

/* BODY */
body{
    background:#f4f6fb;
    overflow-x:hidden;
}

/* HEADER */
header{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    width:92%;
    max-width:1200px;
    padding:14px 25px;
    border-radius:50px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.2);
    z-index:1000;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
}

nav{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:600;
    padding:10px 20px;
    border-radius:25px;
    transition:0.3s;
}

nav a:hover{
    background:white;
    color:#2563eb;
}

nav .active{
    background:white;
    color:#2563eb;
}

/* HERO */
.hero{
    width:100%;
    height:75vh;
    position:relative;
    overflow:hidden;
}

.slide{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    filter:brightness(1.15) contrast(1.05);
    opacity:0;
    transition:opacity 1s ease-in-out;
}

.slide.active{
    opacity:1;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.25);
    z-index:1;
}

.hero-content{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    z-index:2;
    width:90%;
}

.hero-content h1{
    font-size:60px;
}

.hero-content p{
    font-size:20px;
}

.prev,.next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:55px;
    height:55px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,0.25);
    color:white;
    font-size:30px;
    cursor:pointer;
    z-index:3;
}

.prev{left:20px;}
.next{right:20px;}

/* SECTION */
.section{
    padding:80px 20px;
    text-align:center;
}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    margin-top:40px;
}

.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

/* FOOTER */
footer{
    background:#1e3a8a;
    color:white;
    text-align:center;
    padding:30px;
}

/* ===================== */
/* POPUP MENU */
/* ===================== */

.popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:2000;
}

.popup.active{
    display:flex;
}

.popup-content{
    width:95%;
    max-width:1100px;
    background:white;
    border-radius:25px;
    padding:30px;
    position:relative;
}

.close-btn{
    position:absolute;
    top:10px;
    right:20px;
    font-size:35px;
    cursor:pointer;
}

/* 3 FENÊTRES ALIGNÉES */
.menu-grid{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:20px;
}

.menu-box{
    width:300px;
    background:#f4f6fb;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    transition:0.3s;
}

.menu-box:hover{
    transform:translateY(-10px);
}

.menu-box img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.menu-box h3{
    text-align:center;
    padding:15px;
    background:#eef2ff;
    color:#1e3a8a;
}

.menu-box ul{
    list-style:none;
    padding:15px;
}

.menu-box ul li{
    padding:10px 0;
    border-bottom:1px solid #ddd;
}

/* RESPONSIVE */
@media(max-width:900px){
    .menu-grid{
        flex-direction:column;
        align-items:center;
    }

    .menu-box{
        width:90%;
    }
}

</style>
</head>

<body>

<header>
<nav>
    <a class="active" href="#">Home-Zaphir</a>
    <a href="#" id="openMenu">Menu-Choix</a>
    <a href="#">Menu-Selection</a>
</nav>
</header>

<!-- HERO -->
<section class="hero">

    <img src="zaphir1.jpeg" class="slide active">
    <img src="zaphir2.jpeg" class="slide">
    <img src="zaphir3.jpeg" class="slide">

    <div class="overlay"></div>

    <div class="hero-content">
        <h1>Bienvenue Chez Zaphir</h1>
        <p>Best Delicious Food</p>
    </div>

    <button class="prev">&#10094;</button>
    <button class="next">&#10095;</button>

</section>

<!-- POPUP -->
<div class="popup" id="menuPopup">

    <div class="popup-content">

        <span class="close-btn" id="closeMenu">&times;</span>

        <h2 style="text-align:center;color:#1e3a8a;">
            Menu Zaphir
        </h2>

        <div class="menu-grid">

            <div class="menu-box">
                <img src="zaphir2.jpeg">
                <h3>Plats Principaux</h3>
                <ul>
                    <li>Burger</li>
                    <li>Pizza</li>
                    <li>Poulet</li>
                </ul>
            </div>

            <div class="menu-box">
                <img src="zaphir3.jpeg">
                <h3>Croissant & Tarte</h3>
                <ul>
                    <li>Croissant</li>
                    <li>Tarte Fraise</li>
                    <li>Tarte Chocolat</li>
                </ul>
            </div>

            <div class="menu-box">
                <img src="zaphir4.jpeg">
                <h3>Jus & Coffee</h3>
                <ul>
                    <li>Café</li>
                    <li>Jus Orange</li>
                    <li>Milkshake</li>
                </ul>
            </div>

        </div>

    </div>
</div>

<footer>
    <p>© 2026 Zaphir Restaurant</p>
</footer>

<script>

/* SLIDER */
const slides = document.querySelectorAll(".slide");
const nextBtn = document.querySelector(".next");
const prevBtn = document.querySelector(".prev");

let index = 0;

function showSlide(i){
    slides.forEach(s => s.classList.remove("active"));
    slides[i].classList.add("active");
}

nextBtn.onclick = ()=>{
    index = (index + 1) % slides.length;
    showSlide(index);
};

prevBtn.onclick = ()=>{
    index = (index - 1 + slides.length) % slides.length;
    showSlide(index);
};

setInterval(()=>{
    index = (index + 1) % slides.length;
    showSlide(index);
},4000);

/* POPUP MENU */
const openMenu = document.getElementById("openMenu");
const closeMenu = document.getElementById("closeMenu");
const popup = document.getElementById("menuPopup");

openMenu.onclick = (e)=>{
    e.preventDefault();
    popup.classList.add("active");
};

closeMenu.onclick = ()=>{
    popup.classList.remove("active");
};

popup.onclick = (e)=>{
    if(e.target === popup){
        popup.classList.remove("active");
    }
};

</script>

</body>
</html>
