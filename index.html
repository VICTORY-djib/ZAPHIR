<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zaphir Restaurant</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI", Arial, sans-serif;
}

/* BODY */
body{
    background:#f4f6fb;
    overflow-x:hidden;
}

/* HEADER */
header{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    width:92%;
    max-width:1200px;
    padding:14px 25px;
    border-radius:50px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.2);
    z-index:1000;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
}

nav{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

nav a{
    color:white;
    text-decoration:none;
    font-weight:600;
    padding:10px 20px;
    border-radius:25px;
    transition:0.3s;
}

nav a:hover{
    background:white;
    color:#2563eb;
}

nav .active{
    background:white;
    color:#2563eb;
}

/* HERO */
.hero{
    width:100%;
    height:75vh;
    position:relative;
    overflow:hidden;
}

.slide{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    filter:brightness(1.15) contrast(1.05);
    opacity:0;
    transition:opacity 1s ease-in-out;
}

.slide.active{
    opacity:1;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.25);
    z-index:1;
}

.hero-content{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    z-index:2;
    width:90%;
}

.hero-content h1{
    font-size:70px;
    margin-bottom:15px;
}

.hero-content p{
    font-size:22px;
    margin-bottom:25px;
}

.hero-content button{
    padding:15px 35px;
    border:none;
    border-radius:40px;
    background:#2563eb;
    color:white;
    font-size:18px;
}

/* MENU SLIDER BUTTONS */
.prev,.next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:60px;
    height:60px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,0.25);
    color:white;
    font-size:35px;
    cursor:pointer;
    z-index:3;
}

.prev{left:20px;}
.next{right:20px;}

/* SECTION */
.section{
    padding:90px 20px;
    text-align:center;
}

.section h2{
    font-size:42px;
    color:#1e3a8a;
}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:25px;
    margin-top:50px;
}

.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

/* MENU SECTION */
.menu{
    padding:80px 20px;
    text-align:center;
    background:#eef2ff;
}

.menu h2{
    font-size:40px;
    color:#1e3a8a;
}

.menu-tabs{
    display:flex;
    justify-content:center;
    gap:15px;
    margin:30px 0;
}

.tab{
    padding:12px 25px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    background:white;
    font-weight:600;
}

.tab.active{
    background:#2563eb;
    color:white;
}

.menu-container{
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

.menu-box{
    width:320px;
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    display:none;
}

.menu-box.active{
    display:block;
}

.menu-box h3{
    color:#1e3a8a;
    margin-bottom:15px;
}

.menu-box ul{
    list-style:none;
}

.menu-box li{
    padding:10px;
    border-bottom:1px solid #eee;
}

/* FOOTER */
footer{
    background:#1e3a8a;
    color:white;
    text-align:center;
    padding:30px;
}

</style>
</head>

<body>

<header>
<nav>
    <a class="active" href="#">Home-Zaphir</a>
    <a href="#menu" onclick="openMenu()">Menu-Choix</a>
    <a href="#">Menu-Selection</a>
</nav>
</header>

<section class="hero">

    <img src="zaphir1.jpeg" class="slide active">
    <img src="zaphir2.jpeg" class="slide">
    <img src="zaphir3.jpeg" class="slide">
    <img src="zaphir4.jpeg" class="slide">
    <img src="zaphir6.jpeg" class="slide">

    <div class="overlay"></div>

    <div class="hero-content">
        <h1>Bienvenue Chez Zaphir</h1>
        <p>Best Delicious Food</p>
        <button>Nourriture Naturel</button>
    </div>

    <button class="prev">&#10094;</button>
    <button class="next">&#10095;</button>

</section>

<section class="section">
    <h2>Nos Meilleurs Plats</h2>

    <div class="cards">
        <div class="card"><img src="zaphir1.jpg"></div>
        <div class="card"><img src="zaphir2.jpg"></div>
        <div class="card"><img src="zaphir3.jpg"></div>
    </div>
</section>

<!-- MENU -->
<section class="menu" id="menu">

    <h2>Menu Choix</h2>

    <div class="menu-tabs">
        <button class="tab active" onclick="showMenu(event,'lunch')">Déjeuner</button>
        <button class="tab" onclick="showMenu(event,'dinner')">Dîner</button>
    </div>

    <div class="menu-container">

        <div class="menu-box active" id="lunch">
            <h3>🍽️ Déjeuner</h3>
            <ul>
                <li>Burger - 8$</li>
                <li>Pizza - 10$</li>
                <li>Salade - 6$</li>
            </ul>
        </div>

        <div class="menu-box" id="dinner">
            <h3>🌙 Dîner</h3>
            <ul>
                <li>Steak - 15$</li>
                <li>Poisson - 14$</li>
                <li>Pâtes - 12$</li>
            </ul>
        </div>

    </div>

</section>

<footer>
    <p>© 2026 Zaphir Restaurant</p>
</footer>

<script>

/* SLIDER */
const slides = document.querySelectorAll(".slide");
let index = 0;

function showSlide(i){
    slides.forEach(s=>s.classList.remove("active"));
    slides[i].classList.add("active");
}

document.querySelector(".next").onclick = ()=>{
    index = (index+1)%slides.length;
    showSlide(index);
}

document.querySelector(".prev").onclick = ()=>{
    index = (index-1+slides.length)%slides.length;
    showSlide(index);
}

setInterval(()=>{
    index = (index+1)%slides.length;
    showSlide(index);
},4000);

/* MENU */
function showMenu(event,type){

    document.querySelectorAll(".menu-box").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));

    document.getElementById(type).classList.add("active");
    event.target.classList.add("active");
}

/* SCROLL */
function openMenu(){
    document.getElementById("menu").scrollIntoView({behavior:"smooth"});
}

</script>

</body>
</html>
